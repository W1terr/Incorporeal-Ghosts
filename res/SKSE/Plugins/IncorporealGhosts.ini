; Incorporeal Ghosts - settings and detection rules
;
; Ghosts and Wispmothers are incorporeal: weapons pass through them and damaging magic does nothing, unless
;   - the weapon is a ghost weapon (silver, Ghostblade, Dawnbreaker, undead bane enchantments...), or
;   - the ghost stands inside a Yrden sign from The Witcher Signs (optional: without it there is no Yrden), or
;   - the weapon is coated with Spectral Poison.
; The [General] values can also be changed in game with SKSE Menu Framework (they are saved back into this file).
;
; Form lists: comma separated, the same key can be repeated to add more. An entry is either
;   Plugin.esp|0x123456   the form id inside its plugin (load order doesn't matter, ESL ids like 0x800 work too)
;   EditorID              keywords and races always; other forms only if their editor id is kept in memory
;                         (e.g. with powerofthree's Tweaks)
; Entries from plugins that aren't loaded are skipped.
;
; Compatibility: every .ini in Data\SKSE\Plugins\IncorporealGhosts\ is read after this file and its lists are ADDED to
; these (its [General] values are ignored). Patch authors: ship a small file there instead of editing this one.

[General]
bEnabled = 1
; Ghosts that aren't hostile to the player (and not in combat) stay solid: quest and friendly ghosts
bOnlyHostile = 1
; Ghost followers / player teammates and ghosts summoned by the player or a follower (Karstaag...) are left alone
; unless these are on. Ghosts summoned by enemies are always incorporeal.
bAffectFollowers = 0
bAffectSummons = 0
; Magic against incorporeal ghosts: 0 = works as in vanilla, 1 = damage, drain, absorb and stagger do nothing
; (fear, paralysis, calm, Turn Undead still work), 2 = no hostile magic works. Spells and shouts that would do nothing
; fly straight through. Inside Yrden everything works.
iMagicImmunity = 1
; Weapons enchanted with Turn Undead or another undead bane ([GhostWeapons] EnchantmentEffects / -Keywords) are ghost weapons
bUndeadBane = 1
; Silver weapons and ammo ([GhostWeapons] SilverKeywords) and Dawnbreaker ([GhostWeapons] Dawnbreaker) are ghost weapons
bSilverWeapons = 1
bDawnbreaker = 1
; Conjured (bound) weapons are ghost weapons: Bound Sword, Bow, Battleaxe, Dagger and every weapon flagged as bound
bBoundWeapons = 1
; Spectral sound when an attack passes through a ghost
bPassThroughSound = 1
; Ghosts inside Yrden take physical form: their ghost shader comes off and they fade back to solid (Wispmothers, whose
; look is in their mesh, get the [Visuals] RevealShader instead), and turn ghostly again when they leave the sign.
; fFadeTime: seconds the change of form takes
bMaterialize = 1
fFadeTime = 0.4
; Yrden: multiplier on the sign's radius (The Witcher Signs: 14.5 x 22 = 319 units), and how far above / below the
; sign's center a ghost still counts as inside (Wispmothers float)
fYrdenRadius = 1
fYrdenAbove = 400
fYrdenBelow = 150
; Write every pass-through and blocked effect to the SKSE log (Documents\My Games\Skyrim Special Edition\SKSE\IncorporealGhosts.log)
bDebugLog = 0
; Menu and message language: auto (the game's), english, french, german, italian, spanish, polish, russian, japanese, chinese
sLanguage = auto
; Spectral Poison: seconds a coating lasts (fixed, no perk or item changes it), how many each apothecary sells
; (0 = none) and whether they sell its recipe. Vendors restock with them at their next restock (48 hours).
fPoisonDuration = 12
iVendorPoisons = 2
bVendorRecipe = 1

; ---------------------------------------------------------------------------------------------------------- Ghosts
; An actor is a ghost if ANY of these match. Vanilla has no single marker: the ActorTypeGhost keyword is only on some
; ghost NPCs (e.g. not on the Forelhost, Rannveig's Fast, Ansilvund or Volunruud ghosts), Wispmothers use their own
; race without it - but every ghost has a "Ghost Ability" spell that puts a ghost effect shader on it.
[Ghosts]
; on the actor (NPC record) or its race
Keywords = ActorTypeGhost, IG_Incorporeal
; WispRace (Wispmothers, the Pale Lady), WispShadeRace (their shades), DLC2GhostFrostGiantRace (Karstaag's ghost giants)
Races = Skyrim.esm|0x013208, Skyrim.esm|0x0F1182, Dragonborn.esm|0x01CAD8
; Ghost abilities are found automatically: any constant scripted effect (not hostile) whose effect shader is one of
; these makes every spell that has it a ghost ability: GhostAbility, GhostAbilityNew, MGGhostAbility, GhostAbilityViolet,
; the Nightingale and Soul Cairn ghosts, and the copies mods make of them.
; GhostFXShader, GhostFXShaderNew, MGGhostFXShader, GhostVioletFXShader, GhostFXShaderNightingale, GhostFXShaderNightingaleCorrupt, DLC1SoulCairnGhostFXShader
AbilityShaders = Skyrim.esm|0x03B6CB, Skyrim.esm|0x0D2057, Skyrim.esm|0x06A155, Skyrim.esm|0x103129, Skyrim.esm|0x0C5EF7, Skyrim.esm|0x0C7908, Dawnguard.esm|0x019AB3
; more ghost abilities (spells in the actor's or race's spell list, or added by script)
; GhostAbilityFire, GhostAbilityFrost, GhostAbilityStorm (Labyrinthian's elemental ghosts: their shader is fire / frost / shock)
Spells = Skyrim.esm|0x0D2064, Skyrim.esm|0x0D339B, Skyrim.esm|0x0D339F
; base actors (NPC records), when nothing above fits
Actors =

; Never incorporeal, even if they match the above
[Exclude]
Keywords = IG_NotIncorporeal
Races =
; MQ105PhantomFormActor (the Greybeards' practice phantom), EncSummonFamiliar (Conjure Familiar's spectral wolf: it
; wears the ghost shader, but it's Conjuration, not a ghost), DA13hallucinatedSkeever (Waking Nightmare's visions)
Actors = Skyrim.esm|0x02F2DC, Skyrim.esm|0x0640B5, Skyrim.esm|0x0C026A

; ---------------------------------------------------------------------------------------------------- Ghost weapons
; A weapon (melee or bow / crossbow) or ammo is a ghost weapon if ANY of these match. Enchantments count both from the
; weapon record and on the item itself (one the player enchanted, a found enchanted weapon).
[GhostWeapons]
; on the weapon or the ammo: this mod's keyword (always)
Keywords = IG_GhostWeapon
; with bSilverWeapons: silver weapons and ammo (Silver Sword, Silver Greatsword, Bloodskal Blade and every mod weapon
; made of silver)
SilverKeywords = WeapMaterialSilver
; with bDawnbreaker: Dawnbreaker (DA09Dawnbreaker) and the enchantment it has in your load order - mods that change it
; (Zim's Immersive Artifacts...) or add their own versions with that enchantment are covered - and the vanilla one
; (DA09EncDawnbreaker). Weapons and enchantments can be listed here.
Dawnbreaker = Skyrim.esm|0x04E4EE, Skyrim.esm|0x0FEE34
; Ghostblade (always)
Weapons = Skyrim.esm|0x094A2B
; dunAnsilvundGhostbladeENCH (Ghostblade, always)
Enchantments = Skyrim.esm|0x105833
; with bUndeadBane: enchantments with one of these effects, with an effect that has one of the keywords below, or with
; a Turn Undead effect (the Blessed / Sanctified / Reverent / Hallowed / Virtuous / Holy weapons, Red Eagle's Bane)
; DLC1EnchSunDamageUndead, DLC1EnchSunDamageUndeadArrow (Auriel's Bow)
EnchantmentEffects = Dawnguard.esm|0x01571B, Dawnguard.esm|0x01A188
EnchantmentEffectKeywords = MagicTurnUndead

; ------------------------------------------------------------------------------------------------------------ Yrden
[Yrden]
; placed hazards that make ghosts inside their radius vulnerable: The Witcher Signs' _W3S_YrdenHazard
Hazards = W3S.esl|0x820
; the effect The Witcher Signs gives actors inside Yrden (_W3S_YrdenHazardMGEF). Only used when no sign can be found
; around the player (it lingers 3 s after a ghost leaves the circle, the sign's radius is exact)
HazardEffects = W3S.esl|0x81A
; any active effect from this list makes a ghost vulnerable wherever it is (for other mods' revealing spells)
RevealEffects =

; ------------------------------------------------------------------------------------------------------------ Magic
[Magic]
; magic effects with one of these keywords always affect incorporeal ghosts
AllowedKeywords =

; -------------------------------------------------------------------------------------------------- Spectral Poison
; Applied to a weapon it lets that weapon hurt ghosts for fPoisonDuration seconds (melee, and arrows from a coated bow).
; It is taken off the weapon again at once and works on its own timer: vanilla poison perks, charges and potency
; don't touch it, and its effect never reaches anyone.
[Poison]
; brewed at an alchemy lab, once its recipe is read, from exactly these ingredients (the same number of each):
; Ectoplasm, Salt Pile, Deathbell
Ingredients = Skyrim.esm|0x03AD63, Skyrim.esm|0x034CDF, Skyrim.esm|0x0516C8
; shown on the coated weapon while it is drawn: GhostFXShader
WeaponShader = Skyrim.esm|0x03B6CB

; ---------------------------------------------------------------------------------------------------------- Visuals
[Visuals]
; shown on a ghost inside Yrden that had no ghost shader to take off (Wispmothers): EnchPurpleFXShader, Yrden's purple
RevealShader = Skyrim.esm|0x05D607
